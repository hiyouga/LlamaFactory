model: Qwen/Qwen3-0.6B
model_class: llm

kernel_config:
  name: auto

quant_config: null

dist_config:
  name: fsdp2
  dcp_path: null # /mnt/f/pretrain_models/Qwen3-0.6B-dcp

### data
train_dataset: data/v1_sft_demo.yaml


### training
output_dir: outputs/test_fsdp2
micro_batch_size: 2
batching_strategy: dynamic_batching
cutoff_len: 2048
learning_rate: 1.0e-4
max_steps: 10

### sample
sample_backend: hf
max_new_tokens: 128
