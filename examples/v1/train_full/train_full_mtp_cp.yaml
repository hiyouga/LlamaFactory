### MTP + Context Parallelism (Ulysses) — non-GDN model (path C)
#
# Verifies MTP under Ulysses context parallelism WITHOUT a GDN model (Qwen3-0.6B is all
# `full_attention`, so PR #10727's GDN CP path is not exercised — only the MTP-layer CP
# path is). This isolates the Q3 fix (shift_input_ids_for_mtp across the CP boundary).
#
# What this checks:
#   * MTP decoder layers go through the globally-patched `_flash_attention_forward`
#     (Ulysses attention) automatically.
#   * `sequence_parallel_mtp_loss` computes main CP loss + scaled MTP loss (per-head
#     all-gather of labels / loss_weights / log_probs across the CP group).
#   * `shift_input_ids_for_mtp` fills each chunk-tail with the next rank's first token
#     (not a pad) so the next-token embedding is correct at every CP boundary.
#   * `mtp_loss` is logged and should look healthy (finite, decreasing-ish).
#
# Run (needs >= 2 GPUs + flash-attn). Do NOT invoke `torchrun -m` directly — the v1
# launcher detects multiple GPUs and re-launches via torchrun itself, fixing up argv so
# the yaml is parsed correctly. Manually running `torchrun -m llamafactory.cli` pollutes
# sys.argv and makes `data_args.train_dataset` come back as None.
#
#   USE_V1=1 llamafactory-cli train examples/v1/train_full/train_full_mtp_cp.yaml
#
# To pin the process count instead of using all visible GPUs, set NPROC_PER_NODE:
#   NPROC_PER_NODE=2 USE_V1=1 llamafactory-cli train examples/v1/train_full/train_full_mtp_cp.yaml
#
# CP requires `dist_config.name: fsdp2` and `flash_attn: flash_attention_2` (same as
# non-MTP CP). To also exercise GDN CP, switch `model` to a Qwen3.5 series model AND
# cherry-pick PR #10727 (gdn_attention.py) — GDN CP is not yet in upstream main.

model: Qwen/Qwen3-0.6B
model_class: llm

mtp_config:
  name: mtp
  num_layers: 1
  loss_scale: 0.3

flash_attn: flash_attention_2

dist_config:
  name: fsdp2
  dcp_path: null
  cp_mode: ulysses
  cp_size: 2

### data
train_dataset: data/v1_sft_demo.yaml

### training
output_dir: outputs/test_mtp_cp
micro_batch_size: 1
cutoff_len: 2048
learning_rate: 1.0e-4
bf16: false
max_steps: 10
